name: CALPE ONE QUALITY GATE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run automated quality gate
        run: npm run quality:gate

      - name: Commit quality gate result
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quality-gate.json data/quality-gate-last-run.json
          if git diff --cached --quiet; then
            echo "No quality gate changes"
            exit 0
          fi
          git commit -m "chore: update CALPE ONE automated quality gate"
          git pull --rebase origin main
          git push
