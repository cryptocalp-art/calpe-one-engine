name: CALPE ONE ARCHIVE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Merge verified publication package into persistent archive
        run: npm run archive:merge

      - name: Rebuild public site from archive
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run build:web

      - name: Commit archive and website
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/archive-last-run.json docs
          if git diff --cached --quiet; then
            echo "No archive changes"
            exit 0
          fi
          git commit -m "chore: update CALPE ONE persistent archive"
          git pull --rebase origin main
          git push
