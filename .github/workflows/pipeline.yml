name: CALPE ONE PIPELINE

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: calpe-one-pipeline
  cancel-in-progress: false

jobs:
  editorial-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: 0. ARCHIVE — seed existing published news
        run: npm run archive:merge

      - name: 1. RADAR — detect only fresh news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: npm run radar

      - name: 2. INVESTIGATION — verify fresh candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: npm run investigate

      - name: 3. WRITER — create evidence-based drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: npm run write

      - name: 4. EXPORT — validate publication packages
        run: npm run export:vento

      - name: 5. ARCHIVE — merge new verified articles
        run: npm run archive:merge

      - name: 6. MEDIA — assign safe editorial media
        run: npm run media

      - name: 7. WEB PUBLISHER — rebuild from archive and media
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run build:web

      - name: 8. META ASSETS — build committed social JPEG assets
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run meta:assets

      - name: 9. DISTRIBUTION — update deduplicated delivery queue
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run distribution

      - name: Commit complete pipeline output
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: automatic CALPE ONE editorial cycle"
          git pull --rebase origin main
          git push
