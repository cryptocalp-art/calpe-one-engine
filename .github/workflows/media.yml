name: CALPE ONE MEDIA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calpe-one-media
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Assign safe media to archived articles
        run: npm run media

      - name: Rebuild public website with media
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run build:web

      - name: Commit media plan and website
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media.json data/media-last-run.json docs
          if git diff --cached --quiet; then
            echo "No media changes"
            exit 0
          fi
          git commit -m "chore: update CALPE ONE media"
          git pull --rebase origin main
          git push
