name: CALPE ONE META CHECK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - config/meta-production.json
      - src/meta-check.mjs
      - .github/workflows/meta-check.yml

permissions:
  contents: write

concurrency:
  group: calpe-one-meta-check
  cancel-in-progress: false

jobs:
  meta-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Meta credentials and linked assets (read-only)
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: npm run meta:check

      - name: Commit check result
        if: always()
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta-connection-check.json || true
          if git diff --cached --quiet; then
            echo "No Meta check changes"
            exit 0
          fi
          git commit -m "chore: update CALPE ONE Meta connection check"
          git pull --rebase origin main
          git push
