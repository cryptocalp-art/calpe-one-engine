name: CALPE ONE META CHECK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Meta credentials and linked assets (read-only)
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: npm run meta:check

      - name: Commit check result
        if: always()
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta-connection-check.json || true
          if git diff --cached --quiet; then
            echo "No Meta check changes"
            exit 0
          fi
          git commit -m "chore: update CALPE ONE Meta connection check"
          git pull --rebase origin main
          git push
