name: CALPE ONE META DELIVERY

on:
  workflow_dispatch:
    inputs:
      live_test:
        description: "Publish exactly the selected archive_id to Meta for this manual test"
        required: false
        default: false
        type: boolean
      test_archive_id:
        description: "Required when live_test=true; publishes only this archive_id"
        required: false
        type: string
      send_backlog:
        description: "Historical backlog is blocked in production; keep false"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CALPE ONE PIPELINE"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: calpe-one-meta-delivery
  cancel-in-progress: false

jobs:
  meta-delivery:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout latest committed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Validate controlled manual live test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_test }}
        env:
          TEST_ARCHIVE_ID: ${{ inputs.test_archive_id }}
          SEND_BACKLOG: ${{ inputs.send_backlog }}
        run: |
          if [ -z "$TEST_ARCHIVE_ID" ]; then
            echo "live_test=true requires test_archive_id"
            exit 1
          fi
          if [ "$SEND_BACKLOG" = "true" ]; then
            echo "Controlled live test cannot be combined with send_backlog=true"
            exit 1
          fi

      - name: Verify production safety before automatic Meta delivery
        if: ${{ github.event_name == 'workflow_run' }}
        run: npm run production:safety

      - name: Deliver eligible posts to Facebook and Instagram
        env:
          META_PRODUCTION_RUN: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
          META_LIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.live_test && 'true' || 'false' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_TEST_ARCHIVE_ID: ${{ inputs.test_archive_id || '' }}
        run: npm run meta:deliver

      - name: Commit confirmed Meta delivery state
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/distribution.json data/meta-delivery.json data/meta-delivery-last-run.json data/meta-production-state.json
          if git diff --cached --quiet; then
            echo "No Meta delivery changes"
            exit 0
          fi
          git commit -m "chore: update CALPE ONE Meta production delivery state"
          git pull --rebase origin main
          git push
