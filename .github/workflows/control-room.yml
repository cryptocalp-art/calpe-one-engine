name: CALPE ONE CONTROL ROOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/control-room.mjs
      - package.json
      - .github/workflows/control-room.yml

permissions:
  contents: write

concurrency:
  group: calpe-one-control-room
  cancel-in-progress: true

jobs:
  control-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Build CALPE ONE Control Room
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run control:room

      - name: Commit Control Room snapshot
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/control-room.json docs/control-room
          if git diff --cached --quiet; then
            echo "No Control Room changes"
            exit 0
          fi
          git commit -m "chore: refresh CALPE ONE Control Room"
          git pull --rebase origin main
          git push
