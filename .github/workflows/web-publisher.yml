name: CALPE ONE WEB PUBLISHER

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Merge latest verified export into archive
        run: npm run archive:merge

      - name: Build CALPE ONE website from archive
        env:
          SITE_URL: ${{ vars.CALPE_ONE_SITE_URL || 'https://cryptocalp-art.github.io/calpe-one-engine' }}
        run: npm run build:web

      - name: Commit generated website
        run: |
          git config user.name "CALPE ONE ENGINE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/archive-last-run.json docs
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish CALPE ONE website from archive"
          git pull --rebase origin main
          git push
